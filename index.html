<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x968f;&#x8eab;&#x5531;&#x7247;&#x673a;</title>
    <script src="assets/vendor/howler/howler.min.js"></script>
    <script src="siriwave.js"></script>
    <script src="assets/vendor/tailwind/tailwindcss-cdn.js"></script>
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link href="assets/vendor/google-fonts/fonts.css" rel="stylesheet">
    <style>
        /* Soft neumorphic mobile player */
        :root {
            color-scheme: light;
            --paper: #e8eef1;
            --paper-soft: #f4f8f9;
            --paper-deep: #d6e1e5;
            --graphite: #334247;
            --graphite-soft: #6b7d84;
            --graphite-faint: rgba(80, 102, 111, 0.18);
            --accent: #ef7468;
            --accent-deep: #d95d58;
            --accent-cool: #56aebc;
            --line: rgba(255, 255, 255, 0.54);
            --radius: 28px;
            --radius-sm: 18px;
            --shadow: 18px 18px 38px rgba(161, 176, 183, 0.7), -18px -18px 38px rgba(255, 255, 255, 0.94);
            --shadow-soft: 10px 10px 22px rgba(161, 176, 183, 0.55), -10px -10px 22px rgba(255, 255, 255, 0.9);
            --shadow-small: 6px 6px 14px rgba(161, 176, 183, 0.48), -6px -6px 14px rgba(255, 255, 255, 0.88);
            --shadow-pressed: inset 8px 8px 16px rgba(161, 176, 183, 0.58), inset -8px -8px 16px rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--paper);
        }

        body.app-surface {
            position: relative;
            min-height: 100dvh;
            margin: 0;
            padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--graphite);
            background: linear-gradient(145deg, #f5f8f9 0%, var(--paper) 46%, var(--paper-deep) 100%);
            font-family: "ZCOOL XiaoWei", system-ui, sans-serif;
            overscroll-behavior-y: contain;
        }

        body.app-surface::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(115deg, rgba(255, 255, 255, 0.36), transparent 36%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.22) 0 1px, transparent 1px 18px);
            opacity: 0.72;
        }

        body.app-surface ::selection {
            color: #ffffff;
            background: var(--accent-deep);
        }

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(161, 176, 183, 0.22);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(107, 125, 132, 0.54);
            border-radius: 999px;
        }

        @keyframes note-hop {
            0%,
            100% {
                transform: translateY(0) rotate(-4deg) scale(1);
                opacity: 0.72;
            }

            50% {
                transform: translateY(-14px) rotate(5deg) scale(1.12);
                opacity: 1;
            }
        }

        @keyframes bubble-effect {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.86;
            }

            100% {
                transform: translate(var(--translateX), var(--translateY)) scale(0);
                opacity: 0;
            }
        }

        .player-container.phone-player {
            position: relative;
            z-index: 1;
            width: min(100%, 430px);
            height: min(860px, calc(100dvh - 28px));
            min-height: 620px;
            display: grid;
            grid-template-rows: auto 210px auto auto auto auto minmax(260px, 1fr);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.66);
            border-radius: 34px;
            background: linear-gradient(150deg, #f6fafb, var(--paper));
            box-shadow: var(--shadow);
        }

        .player-container.phone-player::before,
        .player-container.phone-player::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border-radius: inherit;
        }

        .player-container.phone-player::before {
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.58);
            box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.72);
        }

        .player-container.phone-player::after {
            inset: auto 22px 18px;
            height: 1px;
            background: rgba(255, 255, 255, 0.72);
        }

        .player-topline,
        .track-meta,
        .progress-panel,
        .volume-panel,
        .playlist-panel {
            padding-inline: 18px;
        }

        .player-topline {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding-top: 16px;
            padding-bottom: 12px;
        }

        .player-kicker {
            display: inline-flex;
            width: fit-content;
            margin: 0;
            padding: 7px 12px;
            border: 0;
            border-radius: 999px;
            background: var(--paper);
            color: var(--graphite-soft);
            box-shadow: var(--shadow-small);
            font-size: 11px;
            font-family: "Patrick Hand", "ZCOOL XiaoWei", cursive;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .player-title {
            margin: 8px 0 0;
            color: var(--graphite);
            font-size: clamp(27px, 7.4vw, 37px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0;
            text-shadow: -1px -1px 0 rgba(255, 255, 255, 0.68);
        }

        .track-position,
        .queue-count {
            flex: 0 0 auto;
            padding: 9px 12px;
            border: 0;
            border-radius: 999px;
            background: var(--paper);
            color: var(--graphite-soft);
            box-shadow: var(--shadow-small);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 13px;
            line-height: 1;
            font-weight: 700;
            text-align: center;
        }

        .cover-shell {
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 0 18px 12px;
        }

        .cover-frame {
            position: relative;
            width: auto;
            height: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: 32px;
            background: linear-gradient(145deg, #f5f9fa, var(--paper));
            box-shadow: var(--shadow-soft);
        }

        .cover-frame::before {
            content: "";
            position: absolute;
            inset: 12px;
            z-index: 6;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.62);
            pointer-events: none;
        }

        .cover-frame::after {
            content: "";
            position: absolute;
            inset: 28px;
            z-index: 1;
            border-radius: 999px;
            box-shadow: var(--shadow-pressed);
            opacity: 0.64;
        }

        #albumArtDefaultContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f6fafb, #dde8ec);
        }

        #albumArtDefaultContainer::before {
            content: "";
            position: absolute;
            inset: 22px;
            z-index: 2;
            border-radius: 26px;
            box-shadow: var(--shadow-pressed);
            pointer-events: none;
        }

        .glass-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(130deg, rgba(255, 255, 255, 0.34), transparent 44%);
        }

        #albumArtDefaultContainer canvas,
        #albumArtDefaultContainer .siriwave-container {
            position: absolute !important;
            inset: 0;
            z-index: 4;
            filter: saturate(1.18) contrast(1.04) opacity(0.94);
            mix-blend-mode: normal;
        }

        #albumArt {
            position: absolute;
            inset: 0;
            z-index: 5;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.92) contrast(1.03);
        }

        #loadingOverlay {
            position: absolute;
            inset: 0;
            z-index: 7;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(232, 238, 241, 0.86);
            color: var(--graphite);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #loadingOverlay p {
            margin: 14px 0 0;
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .music-note-icon {
            display: inline-block;
            margin: 0 5px;
            color: var(--graphite);
            font-size: 18px;
            transform-origin: bottom;
            animation: note-hop 1.2s ease-in-out infinite;
        }

        .music-note-icon:nth-child(2),
        .music-note-icon:nth-child(4) {
            color: var(--accent);
        }

        .music-note-icon:nth-child(2) {
            animation-delay: 0.15s;
        }

        .music-note-icon:nth-child(3) {
            animation-delay: 0.3s;
        }

        .music-note-icon:nth-child(4) {
            animation-delay: 0.45s;
        }

        .track-meta {
            min-width: 0;
            padding-bottom: 10px;
        }

        .track-label {
            width: fit-content;
            margin: 0;
            padding: 7px 12px;
            border: 0;
            border-radius: 999px;
            background: var(--paper);
            color: var(--graphite-soft);
            box-shadow: var(--shadow-small);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 1;
        }

        #songTitle {
            margin: 8px 0 0;
            color: var(--graphite);
            font-size: clamp(24px, 7vw, 32px);
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: 0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-panel {
            position: relative;
            padding-bottom: 8px;
        }

        #particleContainer {
            position: absolute;
            inset: 0 18px auto;
            height: 28px;
            pointer-events: none;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            color: var(--graphite-soft);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .transport-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 14px;
            padding: 6px 34px 10px;
        }

        .control-btn,
        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, color 180ms ease;
        }

        .control-btn {
            width: 52px;
            height: 52px;
            justify-self: center;
            color: var(--graphite-soft);
            background: var(--paper);
            box-shadow: var(--shadow-small);
        }

        .control-btn:hover {
            color: var(--graphite);
            background: #edf3f5;
        }

        .play-button {
            width: 76px;
            height: 76px;
            color: #ffffff;
            background: linear-gradient(145deg, #ff8a7d, var(--accent-deep));
            box-shadow: 10px 12px 24px rgba(217, 93, 88, 0.28), -8px -8px 18px rgba(255, 255, 255, 0.82);
        }

        .play-button:hover {
            background: linear-gradient(145deg, #ff9488, #cf5753);
        }

        .control-btn:active,
        .play-button:active,
        .song-item:active {
            transform: translateY(1px) scale(0.985);
            box-shadow: var(--shadow-pressed);
        }

        .volume-panel {
            display: grid;
            grid-template-columns: 24px 1fr 24px;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            color: var(--graphite-soft);
        }

        .playlist-panel {
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin: 0 12px 12px;
            padding: 0 10px 10px;
            border: 0;
            border-radius: 30px;
            background: var(--paper);
            box-shadow: var(--shadow-pressed);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0 10px;
        }

        .playlist-header h3 {
            margin: 0;
            color: var(--graphite);
            font-size: 19px;
            line-height: 1;
            font-weight: 700;
        }

        .queue-count {
            min-width: auto;
            padding: 8px 11px;
            background: var(--paper);
            color: var(--graphite-soft);
            box-shadow: var(--shadow-small);
        }

        #playlistContainer {
            min-height: 0;
            flex: 1;
            overflow-y: auto;
            display: grid;
            align-content: start;
            gap: 7px;
            padding: 0 3px 3px 0;
            background: transparent;
        }

        .song-item {
            width: 100%;
            min-height: 44px;
            display: grid;
            grid-template-columns: 34px 1fr 24px;
            align-items: center;
            gap: 10px;
            border: 0;
            border-radius: var(--radius-sm);
            padding: 7px 10px;
            color: var(--graphite);
            background: var(--paper);
            text-align: left;
            font: inherit;
            cursor: pointer;
            box-shadow: var(--shadow-small);
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
        }

        .song-item:hover {
            background: #eef4f6;
        }

        .song-item.active {
            color: #ffffff;
            background: linear-gradient(145deg, var(--accent), var(--accent-deep));
            font-weight: 700;
            box-shadow: 7px 8px 18px rgba(217, 93, 88, 0.24), -6px -6px 14px rgba(255, 255, 255, 0.72);
        }

        .song-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 999px;
            color: inherit;
            font-family: "Patrick Hand", cursive;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            box-shadow: var(--shadow-pressed);
        }

        .song-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 500;
        }

        .song-playing-icon {
            color: inherit;
            font-size: 12px;
            opacity: 0;
            justify-self: end;
        }

        .song-item.active .song-playing-icon {
            opacity: 1;
        }

        #progressBar,
        #volumeControl {
            --range-progress: 0%;
            width: 100%;
            height: 28px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        #progressBar::-webkit-slider-runnable-track,
        #volumeControl::-webkit-slider-runnable-track {
            height: 10px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent) 0 var(--range-progress), rgba(213, 225, 230, 0.78) var(--range-progress) 100%);
            box-shadow: var(--shadow-pressed);
        }

        #progressBar::-webkit-slider-thumb,
        #volumeControl::-webkit-slider-thumb {
            width: 24px;
            height: 24px;
            margin-top: -7px;
            border: 0;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, var(--paper));
            box-shadow: var(--shadow-small);
            appearance: none;
            -webkit-appearance: none;
        }

        #progressBar::-moz-range-track,
        #volumeControl::-moz-range-track {
            height: 10px;
            border: 0;
            border-radius: 999px;
            background: rgba(213, 225, 230, 0.78);
            box-shadow: var(--shadow-pressed);
        }

        #progressBar::-moz-range-progress,
        #volumeControl::-moz-range-progress {
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        #progressBar::-moz-range-thumb,
        #volumeControl::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: 0;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, var(--paper));
            box-shadow: var(--shadow-small);
        }

        .text-primary,
        .text-secondary,
        .text-muted {
            color: var(--graphite);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: var(--accent);
            filter: drop-shadow(0 0 6px rgba(239, 116, 104, 0.34));
            animation: bubble-effect 1s ease-out forwards;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex !important;
        }

        /* Depth refinement */
        .player-container.phone-player {
            isolation: isolate;
            background:
                linear-gradient(154deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.08) 35%, rgba(198, 215, 222, 0.36) 100%),
                linear-gradient(145deg, #eef4f6 0%, #dfe9ed 100%);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow:
                24px 26px 54px rgba(136, 154, 162, 0.56),
                -20px -22px 46px rgba(255, 255, 255, 0.94),
                inset 1px 1px 0 rgba(255, 255, 255, 0.88),
                inset -1px -1px 0 rgba(138, 158, 166, 0.16);
        }

        .player-container.phone-player::before {
            inset: 12px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 42%),
                linear-gradient(315deg, rgba(139, 160, 168, 0.10), rgba(255, 255, 255, 0) 45%);
            box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.58);
        }

        .app-header::before {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: -9px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.78), transparent);
            pointer-events: none;
        }

        .soft-pill,
        .track-position {
            border: 1px solid rgba(255, 255, 255, 0.62);
            background: linear-gradient(145deg, #f8fbfc, #dde8ec);
            box-shadow:
                7px 7px 15px rgba(151, 169, 177, 0.44),
                -7px -7px 15px rgba(255, 255, 255, 0.92),
                inset 1px 1px 0 rgba(255, 255, 255, 0.78);
        }

        .track-position {
            background: linear-gradient(145deg, #dce7eb, #f7fbfc);
            box-shadow:
                inset 5px 5px 10px rgba(151, 169, 177, 0.38),
                inset -5px -5px 10px rgba(255, 255, 255, 0.86);
        }

        .player-title {
            color: #31454b;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.82), 0 9px 18px rgba(117, 139, 148, 0.20);
        }

        .track-meta h2,
        #currentSongTitle {
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.66);
        }

        .cover-frame {
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0) 38%),
                linear-gradient(145deg, #f4f9fa, #d8e4e9);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow:
                18px 21px 38px rgba(132, 151, 160, 0.56),
                -16px -18px 34px rgba(255, 255, 255, 0.95),
                inset 1px 1px 0 rgba(255, 255, 255, 0.9),
                inset -1px -1px 0 rgba(119, 142, 151, 0.15);
        }

        .cover-frame::before {
            inset: 13px;
            border-color: rgba(255, 255, 255, 0.52);
            box-shadow:
                inset 8px 8px 18px rgba(143, 163, 172, 0.28),
                inset -8px -8px 18px rgba(255, 255, 255, 0.78);
        }

        .cover-frame::after {
            inset: 23px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.34), rgba(214, 227, 232, 0.12)),
                repeating-conic-gradient(from -8deg, rgba(255, 255, 255, 0.18) 0deg 9deg, rgba(140, 160, 168, 0.08) 9deg 18deg);
            border: 1px solid rgba(255, 255, 255, 0.46);
            box-shadow:
                inset 13px 13px 24px rgba(122, 143, 152, 0.28),
                inset -12px -12px 22px rgba(255, 255, 255, 0.76);
            opacity: 0.82;
        }

        #albumArtDefaultContainer {
            background:
                linear-gradient(150deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.04) 40%, rgba(142, 162, 170, 0.12)),
                var(--paper);
            box-shadow:
                inset 12px 12px 24px rgba(143, 163, 172, 0.34),
                inset -12px -12px 24px rgba(255, 255, 255, 0.82);
        }

        #albumArtDefaultContainer::before {
            inset: 28px;
            border-color: rgba(255, 255, 255, 0.52);
            box-shadow:
                inset 9px 9px 18px rgba(124, 145, 154, 0.30),
                inset -9px -9px 18px rgba(255, 255, 255, 0.76);
        }

        #albumArtDefaultContainer::after {
            content: "";
            position: absolute;
            inset: 57px;
            border-radius: 50%;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.62), rgba(223, 233, 237, 0.18)),
                linear-gradient(315deg, rgba(239, 116, 104, 0.08), rgba(86, 174, 188, 0.10));
            box-shadow:
                9px 9px 18px rgba(134, 153, 161, 0.18),
                -9px -9px 18px rgba(255, 255, 255, 0.62),
                inset 5px 5px 11px rgba(134, 153, 161, 0.20),
                inset -5px -5px 11px rgba(255, 255, 255, 0.68);
            pointer-events: none;
            z-index: 2;
        }

        .siri-wave-container {
            filter: saturate(1.22) drop-shadow(0 6px 9px rgba(86, 174, 188, 0.16));
        }

        .time-display {
            padding: 5px 11px;
            border-radius: 999px;
            background: linear-gradient(145deg, #dce7eb, #f7fbfc);
            box-shadow:
                inset 4px 4px 8px rgba(151, 169, 177, 0.30),
                inset -4px -4px 8px rgba(255, 255, 255, 0.78);
        }

        .control-btn,
        .play-button {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.66);
            transform: translateZ(0);
        }

        .control-btn::before,
        .play-button::before {
            content: "";
            position: absolute;
            inset: 5px 8px auto 8px;

        const $ = (id) => document.getElementById(id);

        const queueCount = $('queueCount');

        const playlistPanel = $('playlistPanel');

        let sound, siriWave, analyser, dataArray, activeMediaSource, activeMediaNode;
        const mediaSourceNodes = new WeakMap();

        let isSeeking = false;
        let isVisualizerSetup = false;
        let frameCounter = 0;
        const idleWaveAmplitude = 0.035;

        const particleColors = ['#ef7468', '#56aebc', '#6faa70', '#d6a24f'];
        const songs = [

            { title: "\u600e\u6837", src: "./music/\u600e\u6837-\u6234\u4f69\u59ae.mp3", albumArt: "" },

            { title: "\u65e0\u5730\u81ea\u5bb9", src: "./music/\u65e0\u5730\u81ea\u5bb9-\u9ed1\u8c79\u4e50\u961f.mp3", albumArt: "" },
            { title: "\u6ca1\u90a3\u4e48\u7b80\u5355", src: "./music/\u6ca1\u90a3\u4e48\u7b80\u5355-\u9ec4\u5c0f\u7425.mp3", albumArt: "" },
            { title: "\u7231 \u5f88\u7b80\u5355", src: "./music/\u7231 \u5f88\u7b80\u5355-\u9676\u5586.mp3", albumArt: "" },
            { title: "\u767d\u5929\u4e0d\u61c2\u591c\u7684\u9ed1", src: "./music/\u767d\u5929\u4e0d\u61c2\u591c\u7684\u9ed1-\u90a3\u82f1.mp3", albumArt: "" },
            { title: "\u767e\u5e74\u5b64\u5bc2", src: "./music/\u767e\u5e74\u5b64\u5bc2-\u738b\u83f2.mp3", albumArt: "" },
            { title: "\u76f4\u5230\u4e16\u754c\u5c3d\u5934", src: "./music/\u76f4\u5230\u4e16\u754c\u5c3d\u5934.mp3", albumArt: "" },
            { title: "\u7a7a\u7a7a\u5982\u4e5f", src: "./music/\u7a7a\u7a7a\u5982\u4e5f-\u4efb\u7136.mp3", albumArt: "" },
            { title: "\u8bf4\u6563\u5c31\u6563", src: "./music/\u8bf4\u6563\u5c31\u6563-\u8881\u5a05\u7ef4.mp3", albumArt: "" },
            { title: "\u8d77\u98ce\u4e86", src: "./music/\u8d77\u98ce\u4e86-\u4e70\u8fa3\u6912\u4e5f\u7528\u5238.mp3", albumArt: "" },
            { title: "\u8def\u8fc7\u4eba\u95f4", src: "./music/\u8def\u8fc7\u4eba\u95f4-\u90c1\u53ef\u552f.mp3", albumArt: "" },
            { title: "\u9047\u89c1", src: "./music/\u9047\u89c1-\u5b59\u71d5\u59ff.mp3", albumArt: "" },
            { title: "\u9065\u8fdc\u7684\u4f60", src: "./music/\u9065\u8fdc\u7684\u4f60-\u4e0d\u9760\u8c31\u7ec4\u5408.mp3", albumArt: "" }
        ];

        function setupVisualizer() {
            if (!Howler.ctx) return false;
            if (!analyser) {
                analyser = Howler.ctx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            const html5Node = getActiveHtml5AudioNode();
            if (html5Node) return connectHtml5Analyser(html5Node);
            try { Howler.masterGain.disconnect(); } catch (_) {}
            try { analyser.disconnect(); } catch (_) {}
            Howler.masterGain.connect(analyser);
            analyser.connect(Howler.ctx.destination);
            isVisualizerSetup = true;
            return true;
        }

        function getActiveHtml5AudioNode() {
            const sounds = sound?._sounds || [];
            const active = sounds.find((item) => item?._node && !item._node.paused);
            const node = active?._node;
            return node && typeof node.play === 'function' ? node : null;
        }

        function connectHtml5Analyser(audioNode) {
            if (!Howler.ctx || !analyser || !audioNode) return false;
            if (activeMediaNode === audioNode && activeMediaSource) return true;
            try { activeMediaSource?.disconnect(); } catch (_) {}
            try { analyser.disconnect(); } catch (_) {}
            try {
                activeMediaSource = mediaSourceNodes.get(audioNode);
                if (!activeMediaSource) {
                    activeMediaSource = Howler.ctx.createMediaElementSource(audioNode);
                    mediaSourceNodes.set(audioNode, activeMediaSource);
                }
                activeMediaSource.connect(analyser);
                analyser.connect(Howler.ctx.destination);
                activeMediaNode = audioNode;
                isVisualizerSetup = true;
                return true;
            } catch (error) {
                try { analyser.connect(Howler.ctx.destination); } catch (_) {}
                return false;
            }
        }

        function updateWaveAmplitude() {
            if (!sound || !sound.playing() || !isVisualizerSetup || !siriWave) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            siriWave.setAmplitude(Math.min(Math.pow((sum / dataArray.length) / 255, 2) * 3, 1));
            requestAnimationFrame(updateWaveAmplitude);
        }

        function emitParticle() {
            const particle = document.createElement('div');
            const size = Math.floor(Math.random() * 4) + 2;
            const max = parseFloat(progressBar.max || 1);
            const percent = max ? parseFloat(progressBar.value || 0) / max : 0;
            const x = percent * (progressBar.offsetWidth - 16) + 8;
            const y = progressBar.offsetHeight / 2;
            particle.className = 'particle';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.color = particleColors[Math.floor(Math.random() * particleColors.length)];
            particle.style.backgroundColor = particle.style.color;
            particle.style.left = (x - size / 2 + 10) + 'px';
            particle.style.top = (y - size / 2) + 'px';
            particle.style.setProperty('--translateX', ((Math.random() - 0.75) * 40) + 'px');
            particle.style.setProperty('--translateY', (-(Math.random() * 20 + 20)) + 'px');
            particleContainer.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        function loadSong(songIndex, playOnLoad = false) {
            if (songIndex < 0 || songIndex >= songs.length) return;
            try { activeMediaSource?.disconnect(); } catch (_) {}
            activeMediaSource = null;
            activeMediaNode = null;
            if (sound) sound.unload();
            if (siriWave) siriWave.setAmplitude(idleWaveAmplitude);
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');
            currentSongIndex = songIndex;
            const song = songs[songIndex];
            trackPosition.textContent = (songIndex + 1) + ' / ' + songs.length;
            songTitle.textContent = song.title;
            songTitle.title = song.title;
            albumArt.classList.add('hidden');
            albumArtDefaultContainer.classList.remove('hidden');
            sound = new Howl({
                src: [song.src],
                html5: true,
                preload: 'metadata',
                format: ['mp3'],
                volume: parseFloat(volumeControl.value),
                onload: () => {
                    setupVisualizer();
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    totalDurationDisplay.textContent = formatTime(sound.duration());
                    progressBar.max = sound.duration() || 0;
                    progressBar.value = 0;
                    currentTimeDisplay.textContent = formatTime(0);
                    updateRangeFill(progressBar);
                    if (playOnLoad) playSong();
                },
                onplay: () => {
                    setupVisualizer();
                    playPauseIcon.classList.replace('fa-play', 'fa-pause');
                    playPauseBtn.setAttribute('aria-label', labels.pause);
                    requestAnimationFrame(updateProgress);
                    requestAnimationFrame(updateWaveAmplitude);
                },
                onpause: setPausedState,
                onend: () => { setPausedState(); nextSong(); },
                onloaderror: (_id, error) => {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    console.error('Howler load error:', error);
                    songTitle.textContent = labels.loadFail;
                    if (siriWave) siriWave.setAmplitude(idleWaveAmplitude);
                }
            });
            updatePlaylistHighlight();
        }

        function setPausedState() {
            playPauseIcon.classList.remove('fa-pause');
            playPauseIcon.classList.add('fa-play');
            playPauseBtn.setAttribute('aria-label', labels.play);
            if (siriWave) siriWave.setAmplitude(idleWaveAmplitude);
        }
        function playSong() { if (!sound) loadSong(currentSongIndex, true); else if (!sound.playing()) sound.play(); }
        function pauseSong() { if (sound && sound.playing()) sound.pause(); }
        function togglePlayPause() { if (!sound || !sound.playing()) playSong(); else pauseSong(); }
        function prevSong() { loadSong((currentSongIndex - 1 + songs.length) % songs.length, true); }
        function nextSong() { loadSong((currentSongIndex + 1) % songs.length, true); }
        function updateProgress() {
            if (sound && sound.playing() && !isSeeking) {
                const seek = sound.seek() || 0;
                currentTimeDisplay.textContent = formatTime(seek);
                progressBar.value = seek;
                updateRangeFill(progressBar);
                frameCounter++;
                if (frameCounter % 8 === 0) emitParticle();
                requestAnimationFrame(updateProgress);
            }
        }
        function setProgress() { if (sound) { sound.seek(parseFloat(progressBar.value)); updateRangeFill(progressBar); } }
        function setVolume() { Howler.volume(parseFloat(volumeControl.value)); updateRangeFill(volumeControl); }
        function formatTime(seconds) { const m = Math.floor(seconds / 60) || 0; const s = Math.floor(seconds % 60) || 0; return m + ':' + (s < 10 ? '0' : '') + s; }
        function updateRangeFill(input) { const min = parseFloat(input.min || 0); const max = parseFloat(input.max || 1); const val = parseFloat(input.value || 0); input.style.setProperty('--range-progress', Math.max(0, Math.min(100, max <= min ? 0 : ((val - min) / (max - min)) * 100)) + '%'); }
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            queueCount.textContent = songs.length + ' ' + labels.unit;
            if (!songs.length) { playlistContainer.innerHTML = '<p class="text-secondary p-4 text-center">' + labels.empty + '</p>'; trackPosition.textContent = '0 / 0'; return; }
            songs.forEach((song, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'song-item';
                button.title = song.title;
                button.setAttribute('aria-label', labels.play + ' ' + song.title);
                const indexSpan = document.createElement('span');
                indexSpan.className = 'song-index';
                indexSpan.textContent = String(index + 1).padStart(2, '0');
                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.textContent = song.title;
                const icon = document.createElement('i');
                icon.className = 'fas fa-wave-square song-playing-icon';
                icon.setAttribute('aria-hidden', 'true');
                button.append(indexSpan, nameSpan, icon);
                bindPhysicalPress(button);
                button.addEventListener('click', () => { loadSong(index, true); setPlaylistOpen(false); });
                playlistContainer.appendChild(button);
            });
            updatePlaylistHighlight();
        }
        function updatePlaylistHighlight() {
            playlistContainer.querySelectorAll('.song-item').forEach((item, index) => {
                const active = index === currentSongIndex;
                item.classList.toggle('active', active);
                item.setAttribute('aria-current', active ? 'true' : 'false');
            });
        }

        function setPlaylistOpen(open) {
            if (!playlistPanel || !playlistScrim || !queueToggleBtn) return;
            playlistPanel.classList.toggle('is-open', open);
            playerShell?.classList.toggle('queue-open', open);
            queueToggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            playlistScrim.hidden = !open;
        }
        function emitAppEvent(name, detail = {}) {
            let event;
            if (typeof CustomEvent === 'function') {
                event = new CustomEvent(name, { detail });
            } else {
                event = document.createEvent('CustomEvent');
                event.initCustomEvent(name, false, false, detail);
            }
            window.dispatchEvent(event);
        }

        function bindPhysicalPress(element) {
            if (!element) return;
            const setPressing = (active) => {
                element.classList.toggle('is-pressing', active);
                emitAppEvent('player3d:press', { id: element.id, active });
            };
            const release = () => setPressing(false);
            element.addEventListener('pointerdown', () => setPressing(true));
            element.addEventListener('pointerup', release);
            element.addEventListener('pointercancel', release);
            element.addEventListener('pointerleave', release);
            element.addEventListener('blur', release);
        }

        [prevBtn, playPauseBtn, nextBtn].forEach(bindPhysicalPress);
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        queueToggleBtn?.addEventListener('click', () => setPlaylistOpen(true));
        queueCloseBtn?.addEventListener('click', () => setPlaylistOpen(false));
        playlistScrim?.addEventListener('click', () => setPlaylistOpen(false));
        window.addEventListener('keydown', (event) => { if (event.key === 'Escape') setPlaylistOpen(false); });
        window.addEventListener('vinyl3d:toggle', togglePlayPause);
        window.addEventListener('vinyl3d:next', nextSong);
        window.addEventListener('vinyl3d:prev', prevSong);
        progressBar.addEventListener('input', () => { isSeeking = true; updateRangeFill(progressBar); currentTimeDisplay.textContent = formatTime(parseFloat(progressBar.value)); });
        progressBar.addEventListener('change', () => { setProgress(); isSeeking = false; });
        progressBar.addEventListener('pointerdown', () => { isSeeking = true; });
        progressBar.addEventListener('pointerup', () => { isSeeking = false; setProgress(); });
        progressBar.addEventListener('pointercancel', () => { isSeeking = false; });
        volumeControl.addEventListener('input', setVolume);
        const player3DState = {
            isPlaying: () => Boolean(sound && sound.playing()),
            getFrequencyData: () => {
                if (!analyser || !dataArray) return null;
                analyser.getByteFrequencyData(dataArray);
                return dataArray;
            },
            getCurrentSongIndex: () => currentSongIndex,
            getVolume: () => parseFloat(volumeControl.value || '0.5')
        };
        window.player3DState = player3DState;
        window.addEventListener('player3d:request-state', (event) => {
            if (event.detail) event.detail.state = player3DState;
        });
        window.addEventListener('load', () => {
            Howler.volume(parseFloat(volumeControl.value));
            updateRangeFill(volumeControl);
            updateRangeFill(progressBar);
            siriWave = new SiriWave({ container: albumArtDefaultContainer, width: albumArtDefaultContainer.offsetWidth, height: albumArtDefaultContainer.offsetHeight, colors: ['#ef7468', '#56aebc', '#6faa70', '#d6a24f'], frequency: 2, speed: 0.05, amplitude: idleWaveAmplitude, cover: true });
            siriWave.start();
            renderPlaylist();
            if (songs.length > 0) loadSong(currentSongIndex); else songTitle.textContent = labels.empty;
        });
    </script>
