<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 播放器</title>
    <script src="../assets/vendor/howler/howler.min.js"></script>
    <script src="./siriwave.js"></script>
    <script src="../assets/vendor/tailwind/tailwindcss-cdn.js"></script>
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css">
    <link href="../assets/vendor/google-fonts/fonts.css" rel="stylesheet">
    <style>
        /* Pencil sketch mobile player */
        :root {
            color-scheme: light;
            --paper: #f7f0da;
            --paper-soft: #fffaf0;
            --paper-deep: #eadfbe;
            --graphite: #3f4743;
            --graphite-soft: #6e766f;
            --graphite-faint: rgba(63, 71, 67, 0.18);
            --accent: #e66b5f;
            --accent-deep: #bd514a;
            --line: #3f4743;
            --radius: 8px;
            --shadow: 7px 9px 0 rgba(63, 71, 67, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--paper-deep);
        }

        body.app-surface {
            position: relative;
            min-height: 100dvh;
            margin: 0;
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--graphite);
            background:
                linear-gradient(90deg, rgba(63, 71, 67, 0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(63, 71, 67, 0.055) 1px, transparent 1px),
                radial-gradient(circle at 18% 12%, rgba(230, 107, 95, 0.12), transparent 22%),
                var(--paper);
            background-size: 22px 22px, 22px 22px, auto, auto;
            font-family: "ZCOOL XiaoWei", system-ui, sans-serif;
            overscroll-behavior-y: contain;
        }

        body.app-surface::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(102deg, transparent 0 9px, rgba(63, 71, 67, 0.035) 9px 10px),
                radial-gradient(rgba(63, 71, 67, 0.12) 0.7px, transparent 0.8px);
            background-size: auto, 9px 9px;
            opacity: 0.62;
            mix-blend-mode: multiply;
        }

        body.app-surface ::selection {
            color: var(--paper-soft);
            background: var(--accent-deep);
        }

        ::-webkit-scrollbar {
            width: 7px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(63, 71, 67, 0.08);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(63, 71, 67, 0.54);
            border-radius: 999px;
        }

        @keyframes note-hop {
            0%,
            100% {
                transform: translateY(0) rotate(-4deg) scale(1);
                opacity: 0.72;
            }

            50% {
                transform: translateY(-14px) rotate(5deg) scale(1.12);
                opacity: 1;
            }
        }

        @keyframes bubble-effect {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.86;
            }

            100% {
                transform: translate(var(--translateX), var(--translateY)) scale(0);
                opacity: 0;
            }
        }

        .player-container.phone-player {
            position: relative;
            z-index: 1;
            width: min(100%, 430px);
            height: min(860px, calc(100dvh - 24px));
            min-height: 620px;
            display: grid;
            grid-template-rows: auto 210px auto auto auto auto minmax(260px, 1fr);
            overflow: hidden;
            border: 2px solid var(--line);
            border-radius: var(--radius);
            background:
                linear-gradient(90deg, rgba(63, 71, 67, 0.055) 1px, transparent 1px),
                linear-gradient(180deg, var(--paper-soft), var(--paper));
            background-size: 18px 18px, auto;
            box-shadow: var(--shadow);
        }

        .player-container.phone-player::before,
        .player-container.phone-player::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border: 1.5px solid rgba(63, 71, 67, 0.32);
            border-radius: var(--radius);
        }

        .player-container.phone-player::before {
            inset: 8px 10px 10px 8px;
            transform: rotate(-0.35deg);
        }

        .player-container.phone-player::after {
            inset: 13px 7px 7px 13px;
            transform: rotate(0.3deg);
            opacity: 0.55;
        }

        .player-topline,
        .track-meta,
        .progress-panel,
        .volume-panel,
        .playlist-panel {
            padding-inline: 18px;
        }

        .player-topline {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding-top: 16px;
            padding-bottom: 12px;
        }

        .player-kicker {
            display: inline-flex;
            width: fit-content;
            margin: 0;
            padding: 5px 8px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius);
            background: var(--paper-soft);
            color: var(--graphite);
            box-shadow: 3px 3px 0 rgba(63, 71, 67, 0.12);
            font-size: 11px;
            font-family: "Patrick Hand", "ZCOOL XiaoWei", cursive;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1;
            transform: rotate(-1deg);
        }

        .player-title {
            margin: 7px 0 0;
            color: var(--graphite);
            font-size: clamp(26px, 7.4vw, 36px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0;
            text-shadow: 1px 1px 0 rgba(63, 71, 67, 0.1);
        }

        .track-position,
        .queue-count {
            flex: 0 0 auto;
            padding: 8px 10px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 250, 240, 0.78);
            color: var(--graphite);
            box-shadow: 3px 3px 0 rgba(63, 71, 67, 0.1);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 13px;
            line-height: 1;
            font-weight: 700;
            text-align: center;
            transform: rotate(1deg);
        }

        .cover-shell {
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 0 18px 12px;
        }

        .cover-frame {
            position: relative;
            width: auto;
            height: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 2px solid var(--line);
            border-radius: var(--radius);
            background:
                repeating-linear-gradient(135deg, rgba(63, 71, 67, 0.08) 0 2px, transparent 2px 8px),
                var(--paper-soft);
            box-shadow: 6px 7px 0 rgba(63, 71, 67, 0.14);
            transform: rotate(-1.2deg);
        }

        .cover-frame::before {
            content: "sketch";
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 6;
            padding: 4px 8px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius);
            background: var(--paper-soft);
            color: var(--graphite-soft);
            font-family: "Patrick Hand", cursive;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;
            transform: rotate(-4deg);
        }

        .cover-frame::after {
            content: "";
            position: absolute;
            right: -20px;
            bottom: -24px;
            z-index: 1;
            width: 62%;
            aspect-ratio: 1;
            border: 2px solid rgba(63, 71, 67, 0.78);
            border-radius: 50%;
            background:
                radial-gradient(circle, var(--paper-soft) 0 12%, var(--accent) 13% 20%, transparent 21%),
                repeating-radial-gradient(circle, rgba(63, 71, 67, 0.86) 0 2px, transparent 3px 8px);
            opacity: 0.68;
        }

        #albumArtDefaultContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(90deg, rgba(63, 71, 67, 0.075) 1px, transparent 1px),
                linear-gradient(0deg, rgba(63, 71, 67, 0.075) 1px, transparent 1px),
                var(--paper-soft);
            background-size: 15px 15px;
        }

        #albumArtDefaultContainer::before {
            content: "";
            position: absolute;
            inset: 18px;
            z-index: 2;
            border: 1.5px dashed rgba(63, 71, 67, 0.5);
            border-radius: var(--radius);
            pointer-events: none;
            transform: rotate(0.8deg);
        }

        .glass-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background:
                linear-gradient(115deg, rgba(255, 250, 240, 0.28), transparent 42%),
                repeating-linear-gradient(0deg, rgba(63, 71, 67, 0.045) 0 1px, transparent 1px 9px);
        }

        #albumArtDefaultContainer canvas,
        #albumArtDefaultContainer .siriwave-container {
            position: absolute !important;
            inset: 0;
            z-index: 4;
            filter: saturate(1.18) contrast(1.04) opacity(0.92);
            mix-blend-mode: normal;
        }

        #albumArt {
            position: absolute;
            inset: 0;
            z-index: 5;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.9) contrast(1.04) sepia(0.1);
            mix-blend-mode: multiply;
        }

        #loadingOverlay {
            position: absolute;
            inset: 0;
            z-index: 7;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(255, 250, 240, 0.84);
            color: var(--graphite);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #loadingOverlay p {
            margin: 14px 0 0;
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .music-note-icon {
            display: inline-block;
            margin: 0 5px;
            color: var(--graphite);
            font-size: 18px;
            transform-origin: bottom;
            animation: note-hop 1.2s ease-in-out infinite;
        }

        .music-note-icon:nth-child(2),
        .music-note-icon:nth-child(4) {
            color: var(--accent);
        }

        .music-note-icon:nth-child(2) {
            animation-delay: 0.15s;
        }

        .music-note-icon:nth-child(3) {
            animation-delay: 0.3s;
        }

        .music-note-icon:nth-child(4) {
            animation-delay: 0.45s;
        }

        .track-meta {
            min-width: 0;
            padding-bottom: 10px;
        }

        .track-label {
            width: fit-content;
            margin: 0;
            padding: 4px 8px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius);
            background: transparent;
            color: var(--graphite-soft);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.06em;
            line-height: 1;
            transform: rotate(-1deg);
        }

        #songTitle {
            margin: 8px 0 0;
            color: var(--graphite);
            font-size: clamp(24px, 7vw, 32px);
            line-height: 1.08;
            font-weight: 700;
            letter-spacing: 0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-panel {
            position: relative;
            padding-bottom: 8px;
        }

        #particleContainer {
            position: absolute;
            inset: 0 18px auto;
            height: 28px;
            pointer-events: none;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            color: var(--graphite-soft);
            font-family: "Patrick Hand", "ZCOOL XiaoWei", system-ui, sans-serif;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .transport-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 14px;
            padding: 6px 34px 10px;
        }

        .control-btn,
        .play-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.8px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .control-btn {
            width: 52px;
            height: 52px;
            justify-self: center;
            color: var(--graphite);
            background: var(--paper-soft);
            box-shadow: 4px 5px 0 rgba(63, 71, 67, 0.12);
        }

        .control-btn:hover {
            background: #f4ead0;
        }

        .play-button {
            width: 74px;
            height: 74px;
            color: var(--paper-soft);
            background: var(--accent);
            box-shadow: 5px 6px 0 rgba(63, 71, 67, 0.16);
        }

        .play-button:hover {
            background: var(--accent-deep);
        }

        .control-btn:active,
        .play-button:active,
        .song-item:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 2px 2px 0 rgba(63, 71, 67, 0.18);
        }

        .volume-panel {
            display: grid;
            grid-template-columns: 24px 1fr 24px;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            color: var(--graphite-soft);
        }

        .playlist-panel {
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin: 0 12px 12px;
            padding: 0 10px 10px;
            border: 2px solid var(--line);
            border-radius: var(--radius);
            background:
                linear-gradient(0deg, rgba(230, 107, 95, 0.12) 1px, transparent 1px),
                var(--paper-soft);
            background-size: 100% 44px, auto;
            box-shadow: inset 0 0 0 2px rgba(63, 71, 67, 0.08);
            transform: rotate(0.25deg);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0 10px;
        }

        .playlist-header h3 {
            margin: 0;
            color: var(--graphite);
            font-size: 19px;
            line-height: 1;
            font-weight: 700;
        }

        .queue-count {
            min-width: auto;
            padding: 7px 9px;
            background: transparent;
            color: var(--graphite-soft);
            box-shadow: none;
        }

        #playlistContainer {
            min-height: 0;
            flex: 1;
            overflow-y: auto;
            display: grid;
            align-content: start;
            gap: 6px;
            padding: 0 2px 2px 0;
            background: transparent;
        }

        .song-item {
            width: 100%;
            min-height: 44px;
            display: grid;
            grid-template-columns: 34px 1fr 24px;
            align-items: center;
            gap: 10px;
            border: 1.5px solid var(--graphite-faint);
            border-radius: var(--radius);
            padding: 6px 9px;
            color: var(--graphite);
            background: rgba(255, 250, 240, 0.62);
            text-align: left;
            font: inherit;
            cursor: pointer;
            box-shadow: 2px 2px 0 rgba(63, 71, 67, 0.07);
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
        }

        .song-item:nth-child(even) {
            transform: rotate(-0.18deg);
        }

        .song-item:nth-child(odd) {
            transform: rotate(0.15deg);
        }

        .song-item:hover {
            background: rgba(234, 223, 190, 0.42);
            border-color: rgba(63, 71, 67, 0.42);
        }

        .song-item.active {
            color: var(--paper-soft);
            border-color: var(--accent-deep);
            background: var(--accent);
            font-weight: 700;
        }

        .song-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1.5px solid currentColor;
            border-radius: 999px;
            color: inherit;
            font-family: "Patrick Hand", cursive;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .song-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 500;
        }

        .song-playing-icon {
            color: inherit;
            font-size: 12px;
            opacity: 0;
            justify-self: end;
        }

        .song-item.active .song-playing-icon {
            opacity: 1;
        }

        #progressBar,
        #volumeControl {
            --range-progress: 0%;
            width: 100%;
            height: 28px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        #progressBar::-webkit-slider-runnable-track,
        #volumeControl::-webkit-slider-runnable-track {
            height: 8px;
            border: 1.5px solid var(--line);
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent) 0 var(--range-progress), rgba(255, 250, 240, 0.86) var(--range-progress) 100%);
        }

        #progressBar::-webkit-slider-thumb,
        #volumeControl::-webkit-slider-thumb {
            width: 22px;
            height: 22px;
            margin-top: -8px;
            border: 1.5px solid var(--line);
            border-radius: 50%;
            background: var(--paper-soft);
            box-shadow: 3px 3px 0 rgba(63, 71, 67, 0.16);
            appearance: none;
            -webkit-appearance: none;
        }

        #progressBar::-moz-range-track,
        #volumeControl::-moz-range-track {
            height: 8px;
            border: 1.5px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 250, 240, 0.86);
        }

        #progressBar::-moz-range-progress,
        #volumeControl::-moz-range-progress {
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        #progressBar::-moz-range-thumb,
        #volumeControl::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--line);
            border-radius: 50%;
            background: var(--paper-soft);
        }

        .text-primary,
        .text-secondary,
        .text-muted {
            color: var(--graphite);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: var(--accent);
            filter: drop-shadow(0 0 4px rgba(230, 107, 95, 0.32));
            animation: bubble-effect 1s ease-out forwards;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex !important;
        }

        @media (max-width: 390px) {
            body.app-surface {
                padding: 0;
            }

            .player-container.phone-player {
                width: 100%;
                height: 100dvh;
                min-height: 0;
                border-radius: 0;
                border-inline: 0;
            }

            .player-topline,
            .track-meta,
            .progress-panel,
            .volume-panel {
                padding-inline: 16px;
            }

            .cover-shell {
                padding-inline: 16px;
            }

            .transport-controls {
                padding-inline: 24px;
            }
        }

        @media (max-height: 720px) {
            .player-container.phone-player {
                grid-template-rows: auto 142px auto auto auto auto minmax(200px, 1fr);
            }

            .player-topline {
                padding-top: 11px;
                padding-bottom: 8px;
            }

            .player-title {
                font-size: 24px;
            }

            .cover-shell {
                padding-bottom: 8px;
            }

            .track-meta {
                padding-bottom: 7px;
            }

            #songTitle {
                font-size: clamp(21px, 6vw, 25px);
            }

            .transport-controls {
                padding-top: 4px;
                padding-bottom: 6px;
            }

            .control-btn {
                width: 48px;
                height: 48px;
            }

            .play-button {
                width: 64px;
                height: 64px;
            }

            .volume-panel {
                padding-bottom: 7px;
            }

            .playlist-header {
                padding-top: 9px;
                padding-bottom: 8px;
            }
        }

        @media (max-height: 650px) {
            .player-container.phone-player {
                grid-template-rows: auto 118px auto auto auto auto minmax(188px, 1fr);
            }

            .player-kicker {
                padding-block: 5px;
            }

            .player-title {
                margin-top: 5px;
                font-size: 22px;
            }

            .song-item {
                min-height: 42px;
                padding-block: 5px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="app-surface">

    <main class="player-container phone-player" aria-label="MP3 播放器">
        <header class="player-topline">
            <div>
                <p class="player-kicker">PENCIL MIX</p>
                <h1 class="player-title">铅笔随身听</h1>
            </div>
            <span id="trackPosition" class="track-position">1 / 28</span>
        </header>

        <section class="cover-shell" aria-label="封面与音频波形">
            <div class="cover-frame">
                <div id="albumArtDefaultContainer">
                    <div class="glass-overlay"></div>
                    <div id="loadingOverlay" class="hidden">
                        <div>
                            <i class="fas fa-music music-note-icon"></i>
                            <i class="fas fa-music music-note-icon"></i>
                            <i class="fas fa-music music-note-icon"></i>
                            <i class="fas fa-music music-note-icon"></i>
                        </div>
                        <p>正在加载...</p>
                    </div>
                </div>
                <img id="albumArt" src="" alt="专辑封面" class="hidden">
            </div>
        </section>

        <section class="track-meta">
            <p class="track-label">NOW SPINNING</p>
            <h2 id="songTitle" title="歌曲名称">歌曲名称</h2>
        </section>

        <section class="progress-panel" aria-label="播放进度">
            <div id="particleContainer"></div>
            <input type="range" id="progressBar" value="0" aria-label="播放进度">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
        </section>

        <section class="transport-controls" aria-label="播放控制">
            <button id="prevBtn" class="control-btn" type="button" aria-label="上一首">
                <i class="fas fa-backward-step fa-lg"></i>
            </button>
            <button id="playPauseBtn" class="play-button" type="button" aria-label="播放">
                <i class="fas fa-play fa-xl"></i>
            </button>
            <button id="nextBtn" class="control-btn" type="button" aria-label="下一首">
                <i class="fas fa-forward-step fa-lg"></i>
            </button>
        </section>

        <section class="volume-panel" aria-label="音量">
            <i class="fas fa-volume-low" aria-hidden="true"></i>
            <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5" aria-label="音量">
            <i class="fas fa-volume-high" aria-hidden="true"></i>
        </section>

        <section class="playlist-panel">
            <div class="playlist-header">
                <h3>手写歌单</h3>
                <span id="queueCount" class="queue-count">28 首</span>
            </div>
            <div id="playlistContainer" class="playlist-bg">
                <!-- 播放列表项将由 JavaScript 在此创建 -->
            </div>
        </section>
    </main>

    <script>
        // --- DOM Elements ---
        const albumArtDefaultContainer = document.getElementById('albumArtDefaultContainer');
        const albumArt = document.getElementById('albumArt');
        const songTitle = document.getElementById('songTitle');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalDurationDisplay = document.getElementById('totalDuration');
        const prevBtn = document.getElementById('prevBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = playPauseBtn.querySelector('i');
        const nextBtn = document.getElementById('nextBtn');
        const volumeControl = document.getElementById('volumeControl');
        const playlistContainer = document.getElementById('playlistContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const particleContainer = document.getElementById('particleContainer');
        const queueCount = document.getElementById('queueCount');
        const trackPosition = document.getElementById('trackPosition');

        // --- Player State ---
        let sound;
        let currentSongIndex = 0;
        let isSeeking = false;
        let siriWave;
        let analyser;
        let dataArray;
        let isVisualizerSetup = false;
        let frameCounter = 0;
        const particleColors = ['#3f4743', '#6e766f', '#e66b5f', '#bd514a'];

        // --- Songs Data ---
        const songsUrl = './'
        const songs = [
            { title: "FreeLoop", src: songsUrl + "Free_Loop.mp3", albumArt: "" },
            { title: "ThatGirl", src: songsUrl + "That_Girl.mp3", albumArt: "" },
            { title: "思念是一种病", src: songsUrl + "思念是一种病.mp3", albumArt: "" },
            { title: "一生有你", src: songsUrl + "一生有你-水木年华.mp3", albumArt: "" },
            { title: "下雨天", src: songsUrl + "下雨天-南拳妈妈.mp3", albumArt: "" },
            { title: "世界が終るまでは", src: songsUrl + "世界が終るまでは.mp3", albumArt: "" },
            { title: "光阴的故事", src: songsUrl + "光阴的故事-罗大佑.mp3", albumArt: "" },
            { title: "凤凰花开的路口", src: songsUrl + "凤凰花开的路口-胡夏.mp3", albumArt: "" },
            { title: "原来你也在这里", src: songsUrl + "原来你也在这里-刘若英.mp3", albumArt: "" },
            { title: "和你一样", src: songsUrl + "和你一样-李宇春.mp3", albumArt: "" },
            { title: "夜空中最亮的星", src: songsUrl + "夜空中最亮的星-逃跑计划.mp3", albumArt: "" },
            { title: "往后余生", src: songsUrl + "往后余生-王贰浪.mp3", albumArt: "" },
            { title: "忽然之间", src: songsUrl + "忽然之间-莫文蔚.mp3", albumArt: "" },
            { title: "怎样", src: songsUrl + "怎样-戴佩妮.mp3", albumArt: "" },
            { title: "成都", src: songsUrl + "成都-赵雷.mp3", albumArt: "" },
            { title: "我很快乐", src: songsUrl + "我很快乐-刘惜君.mp3", albumArt: "" },
            { title: "无地自容", src: songsUrl + "无地自容-黑豹乐队.mp3", albumArt: "" },
            { title: "没那么简单", src: songsUrl + "没那么简单-黄小琥.mp3", albumArt: "" },
            { title: "爱 很简单", src: songsUrl + "爱 很简单-陶喆.mp3", albumArt: "" },
            { title: "白天不懂夜的黑", src: songsUrl + "白天不懂夜的黑-那英.mp3", albumArt: "" },
            { title: "百年孤寂", src: songsUrl + "百年孤寂-王菲.mp3", albumArt: "" },
            { title: "直到世界尽头", src: songsUrl + "直到世界尽头.mp3", albumArt: "" },
            { title: "空空如也", src: songsUrl + "空空如也-任然.mp3", albumArt: "" },
            { title: "说散就散", src: songsUrl + "说散就散-袁娅维.mp3", albumArt: "" },
            { title: "起风了", src: songsUrl + "起风了-买辣椒也用券.mp3", albumArt: "" },
            { title: "路过人间", src: songsUrl + "路过人间-郁可唯.mp3", albumArt: "" },
            { title: "遇见", src: songsUrl + "遇见-孙燕姿.mp3", albumArt: "" },
            { title: "遥远的你", src: songsUrl + "遥远的你-不靠谱组合.mp3", albumArt: "" }
        ];

        // --- Audio Analysis ---
        function setupVisualizer() {
            if (!Howler.ctx || isVisualizerSetup) return;
            analyser = Howler.ctx.createAnalyser();

            // Re-route the master gain through the analyser to ensure it gets the data
            Howler.masterGain.disconnect();
            Howler.masterGain.connect(analyser);
            analyser.connect(Howler.ctx.destination);

            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isVisualizerSetup = true;
        }

        function updateWaveAmplitude() {
            if (!sound || !sound.playing() || !isVisualizerSetup) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;

            // Map the average volume (0-255) to a suitable amplitude (0-1)
            // Add a bit of a curve to make the response more noticeable
            const amplitude = Math.pow(average / 255, 2) * 3;

            siriWave.setAmplitude(Math.min(amplitude, 1)); // Cap at 1

            requestAnimationFrame(updateWaveAmplitude);
        }

        function emitParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            const size = Math.floor(Math.random() * 4) + 2; // 2px to 6px
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;

            particle.style.backgroundColor = particleColors[Math.floor(Math.random() * particleColors.length)];

            // Accurately calculate the thumb's center position
            const thumbWidth = 16; // Approximate pixel width of the range thumb
            const trackWidth = progressBar.offsetWidth;
            const progressPercent = progressBar.value / progressBar.max;
            const thumbPositionX = progressPercent * (trackWidth - thumbWidth) + (thumbWidth / 2);
            const thumbPositionY = progressBar.offsetHeight / 2;

            // Center the particle on the thumb's center, and shift slightly left for the "exhaust" effect
            particle.style.left = `${thumbPositionX - (size / 2) + 10}px`;
            particle.style.top = `${thumbPositionY - (size / 2)}px`;

            // Randomize the particle's destination for a more natural effect
            const randomX = (Math.random() - 0.75) * 40; // Skew to the left
            const randomY = -(Math.random() * 20 + 20);
            particle.style.setProperty('--translateX', `${randomX}px`);
            particle.style.setProperty('--translateY', `${randomY}px`);

            particleContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 1000); // Remove particle after animation (1s)
        }

        // --- Core Player Functions ---

        function loadSong(songIndex, playOnLoad = false) {
            if (songIndex < 0 || songIndex >= songs.length) return;

            // Unload previous sound
            if (sound) {
                sound.unload();
            }
            if (siriWave) {
                siriWave.setAmplitude(0);
            }

            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            currentSongIndex = songIndex;
            const song = songs[songIndex];
            trackPosition.textContent = `${songIndex + 1} / ${songs.length}`;

            albumArt.classList.add('hidden');
            albumArtDefaultContainer.classList.remove('hidden');

            songTitle.textContent = song.title;
            songTitle.title = song.title;

            // Handle Album Art
            if (song.albumArt && song.albumArt.trim() !== "" && song.albumArt !== "NO_ART") {
                albumArt.src = song.albumArt;
                albumArt.onload = () => {
                    albumArt.classList.remove('hidden');
                    albumArtDefaultContainer.classList.add('hidden');
                }
                albumArt.onerror = () => {
                    albumArt.classList.add('hidden');
                    albumArtDefaultContainer.classList.remove('hidden');
                }
            } else {
                albumArt.src = "";
                albumArt.classList.add('hidden');
                albumArtDefaultContainer.classList.remove('hidden');
            }

            sound = new Howl({
                src: [song.src],
                volume: parseFloat(volumeControl.value),
                onload: () => {
                    if (!isVisualizerSetup) {
                        setupVisualizer();
                    }
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    totalDurationDisplay.textContent = formatTime(sound.duration());
                    progressBar.max = sound.duration();
                    progressBar.value = 0;
                    currentTimeDisplay.textContent = formatTime(0);
                    updateRangeFill(progressBar);
                    if (playOnLoad) playSong();
                },
                onplay: () => {
                    playPauseIcon.classList.remove('fa-play');
                    playPauseIcon.classList.add('fa-pause');
                    playPauseBtn.setAttribute('aria-label', '暂停');
                    document.body.classList.add('is-playing');
                    requestAnimationFrame(updateProgress);
                    requestAnimationFrame(updateWaveAmplitude); // Start the animation loop
                },
                onpause: () => {
                    playPauseIcon.classList.remove('fa-pause');
                    playPauseIcon.classList.add('fa-play');
                    playPauseBtn.setAttribute('aria-label', '播放');
                    document.body.classList.remove('is-playing');
                    if (siriWave) siriWave.setAmplitude(0);
                },
                onend: () => {
                    playPauseIcon.classList.remove('fa-pause');
                    playPauseIcon.classList.add('fa-play');
                    playPauseBtn.setAttribute('aria-label', '播放');
                    document.body.classList.remove('is-playing');
                    if (siriWave) siriWave.setAmplitude(0);
                    nextSong();
                },
                onloaderror: (id, err) => {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                    console.error("Howler load error:", err);
                    songTitle.textContent = "加载失败";
                    if (siriWave) siriWave.setAmplitude(0);
                }
            });

            updatePlaylistHighlight();
        }

        function playSong() {
            if (!sound) { // If no sound is loaded, load the first one
                loadSong(currentSongIndex, true);
                return;
            }
            if (!sound.playing()) {
                sound.play();
            }
        }

        function pauseSong() {
            if (sound && sound.playing()) {
                sound.pause();
            }
        }

        function togglePlayPause() {
            if (!sound) {
                playSong(); // Will load and then play
            } else if (sound.playing()) {
                pauseSong();
            } else {
                playSong();
            }
        }

        function prevSong() {
            let newIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(newIndex, true);
        }

        function nextSong() {
            let newIndex = (currentSongIndex + 1) % songs.length;
            loadSong(newIndex, true);
        }

        function updateProgress() {
            if (sound && sound.playing() && !isSeeking) {
                const seek = sound.seek() || 0;
                currentTimeDisplay.textContent = formatTime(seek);
                progressBar.value = seek;
                updateRangeFill(progressBar);

                frameCounter++;
                if (frameCounter % 8 === 0) { // Emit particle every 8 frames to reduce density
                    emitParticle();
                }

                requestAnimationFrame(updateProgress); // Continue the loop
            }
        }

        function setProgress() {
            if (sound) {
                sound.seek(parseFloat(progressBar.value));
                updateRangeFill(progressBar);
            }
        }

        function setVolume() {
            Howler.volume(parseFloat(volumeControl.value));
            updateRangeFill(volumeControl);
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60) || 0;
            const secs = Math.floor(seconds % 60) || 0;
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateRangeFill(input) {
            const min = parseFloat(input.min || 0);
            const max = parseFloat(input.max || 1);
            const value = parseFloat(input.value || 0);
            const percent = max <= min ? 0 : ((value - min) / (max - min)) * 100;
            input.style.setProperty('--range-progress', `${Math.max(0, Math.min(100, percent))}%`);
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            queueCount.textContent = `${songs.length} 首`;
            if (songs.length === 0) {
                playlistContainer.innerHTML = '<p class="text-secondary p-4 text-center">播放列表为空。</p>';
                trackPosition.textContent = '0 / 0';
                return;
            }
            songs.forEach((song, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.classList.add('song-item');
                button.title = song.title;
                button.setAttribute('aria-label', `播放 ${song.title}`);

                const indexSpan = document.createElement('span');
                indexSpan.className = 'song-index';
                indexSpan.textContent = String(index + 1).padStart(2, '0');

                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.textContent = song.title;

                const icon = document.createElement('i');
                icon.className = 'fas fa-wave-square song-playing-icon';
                icon.setAttribute('aria-hidden', 'true');

                button.append(indexSpan, nameSpan, icon);
                button.addEventListener('click', () => {
                    loadSong(index, true);
                });
                playlistContainer.appendChild(button);
            });
            updatePlaylistHighlight();
        }

        function updatePlaylistHighlight() {
            const songItems = playlistContainer.querySelectorAll('.song-item');
            songItems.forEach((item, index) => {
                const active = index === currentSongIndex;
                item.classList.toggle('active', active);
                item.setAttribute('aria-current', active ? 'true' : 'false');
            });
        }

        // --- Event Listeners ---
        playPauseBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        progressBar.addEventListener('input', () => {
            isSeeking = true;
            updateRangeFill(progressBar);
            currentTimeDisplay.textContent = formatTime(parseFloat(progressBar.value));
        });
        progressBar.addEventListener('change', () => {
            setProgress();
            isSeeking = false;
        });
        progressBar.addEventListener('pointerdown', () => { isSeeking = true; });
        progressBar.addEventListener('pointerup', () => { isSeeking = false; setProgress(); });
        progressBar.addEventListener('pointercancel', () => { isSeeking = false; });

        volumeControl.addEventListener('input', setVolume);

        window.addEventListener('load', () => {
            Howler.volume(parseFloat(volumeControl.value));
            updateRangeFill(volumeControl);
            updateRangeFill(progressBar);

            // 将 SiriWave 的 z-index 设置得比玻璃覆盖层高
            const siriwaveContainer = document.querySelector('#albumArtDefaultContainer .siriwave-container');
            if (siriwaveContainer) {
                siriwaveContainer.style.zIndex = 2;
            }

            siriWave = new SiriWave({
                container: albumArtDefaultContainer,
                width: albumArtDefaultContainer.offsetWidth,
                height: albumArtDefaultContainer.offsetHeight,
                colors: [
                    '#e66b5f',
                    '#4c9bb7',
                    '#6faa70',
                    '#d6a24f'
                ],
                frequency: 2,
                speed: 0.05,
                amplitude: 0,
                cover: true
            });
            siriWave.start();

            if (songs.length > 0) {
                loadSong(currentSongIndex);
            } else {
                songTitle.textContent = "播放列表为空";
                totalDurationDisplay.textContent = "0:00";
            }
            renderPlaylist();
        });

        window.addEventListener('resize', () => {
            // The siriwave library doesn't have a built-in resize handler,
            // so for a truly responsive solution, it would need to be destroyed and recreated.
            // For now, we'll leave it as is.
        });

    </script>
</body>

</html>
